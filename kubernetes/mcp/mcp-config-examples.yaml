# Ejemplo de ConfigMap con nombres de servicios y namespaces que usa server_k8s.py
apiVersion: v1
kind: ConfigMap
metadata:
  name: database-connections
  namespace: default
data:
  POSTGRESQL_SERVICE: postgresql-service
  POSTGRESQL_NAMESPACE: default
  SQL1_SERVICE: sqlserver1-service
  SQL1_NAMESPACE: default
  MONGODB_SERVICE: mongodb-service
  MONGODB_NAMESPACE: default
---
# Ejemplo de Secret para PostgreSQL. Usamos stringData para editar claramente, K8s se encarga
# de codificar en base64.
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-credentials
  namespace: default
type: Opaque
stringData:
  database: mydb
  username: myuser
  password: mypass
---
# Ejemplo de Secret para SQL Server
apiVersion: v1
kind: Secret
metadata:
  name: sqlserver1-credentials
  namespace: default
type: Opaque
stringData:
  database: sqldb
  username: sa
  password: StrongPasswordHere
---
# Ejemplo de Secret para MongoDB
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  namespace: default
type: Opaque
stringData:
  database: my_mongo_db
  username: mongo_user
  password: mongo_password

# Ejemplo de ConfigMap con nombres de servicios y namespaces que usa server_k8s.py
apiVersion: v1
kind: ConfigMap
metadata:
  name: database-connections
  namespace: default
data:
  POSTGRESQL_SERVICE: postgresql-service
  POSTGRESQL_NAMESPACE: default
  SQL1_SERVICE: sqlserver1-service
  SQL1_NAMESPACE: default
  MONGODB_SERVICE: mongodb-service
  MONGODB_NAMESPACE: default
---
# Ejemplo de Secret para PostgreSQL. Usamos stringData para editar claramente, K8s se encarga
# de codificar en base64.
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-credentials
  namespace: default
type: Opaque
stringData:
  database: promptsales
  username: postgres
  password: postgres123
---
# Ejemplo de Secret para SQL Server 1
apiVersion: v1
kind: Secret
metadata:
  name: sqlserver1-credentials
  namespace: default
type: Opaque
stringData:
  database: promptads
  username: sa
  password: YourStrong!Passw0rd
---
# Ejemplo de Secret para SQL Server 2
apiVersion: v1
kind: Secret
metadata:
  name: sqlserver2-credentials
  namespace: default
type: Opaque
stringData:
  database: promptcrm
  username: sa
  password: YourStrong!Passw0rd
---
# Ejemplo de Secret para MongoDB
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  namespace: default
type: Opaque
stringData:
  database: promptcontent
  # Si tu MongoDB NO usa autenticación (como en tu caso con MongoDB Compass),
  # puedes omitir username/password. Si usas autenticación, descomenta y
  # rellena las siguientes claves:
  # username: promptcontent
  # password: mongo_password

apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-config-reader
  namespace: default
rules:
  # Permisos para leer ConfigMaps y Secrets donde se guardan las credenciales
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
    # Permisos para leer Services (puertos) si fuera necesario
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-config-reader-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: mcp-server-sa
    namespace: default
roleRef:
  kind: Role
  name: mcp-config-reader
  apiGroup: rbac.authorization.k8s.io

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: default
  labels:
    app: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      serviceAccountName: mcp-server-sa
      containers:
        - name: mcp-server
          # Cambia esta imagen por la que construyas que contenga el MCP code + requirements
          image: your-registry/mcp-server:latest
          imagePullPolicy: IfNotPresent
          # Comando de ejemplo: ejecuta el start del servidor desde el paquete/entrypoint
          # Ajusta el comando según cómo empaquetes tu aplicación en la imagen
          command:
            - "sh"
            - "-c"
            - 'python -u -c "import asyncio; from src.server_k8s import create_server; asyncio.run(create_server())"'
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pgrep -f server_k8s || exit 1"]
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pgrep -f server_k8s || exit 1"]
            initialDelaySeconds: 5
            periodSeconds: 10
      # Añade tolerations/nodeSelector/volumes si los necesitas para tu entorno
